<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>The Fir &amp; the Dachshund</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #000; color: #e4dcce; color-scheme: dark }
  main { min-height: 100svh; display: grid; place-content: center; justify-items: center }
  canvas { display: block; width: min(100vw, 150svh, 1500px); height: min(87svh, 104vw, 970px); cursor: pointer; }
  button { width: 44px; height: 44px; display: grid; place-items: center; background: #080a09;
    border: 1px solid #3f4844; border-radius: 50%; cursor: pointer; color: #dce4db; }
  button:focus-visible { outline: 2px solid #e8c886; outline-offset: 4px; }
  @media (hover:hover) { button:hover { color: #fff3cb; border-color: #998467; } }
  .controls { display: flex; gap: 14px; }
  .icon { width: 12px; height: 14px; border-left: 4px solid; border-right: 4px solid; }
  button[data-playing="false"] .icon { width: 0; height: 0; margin-left: 3px; border: 0;
    border-left: 11px solid currentColor; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
</style>
</head>
<body>
<main>
  <canvas id="scene" width="800" height="640" role="img" aria-label="On black, drawn in text: a strand spelling O Christmas Tree winds upward into a turning fir lettered with carols, standing in shaded snowdrifts that glint as snow falls past in layers. Fairy lights sparkle among the boughs and a few glass baubles hang under the branch tips. Presents tagged To You and Open Me drop out of twinkles in the air, squash, bounce and pop their lids, and a dachshund in a floppy Santa hat trots up and sneezes when a snowflake lands on its nose. The sneeze shakes the tree, its lights stutter, the presents jump, and snow tumbles off the boughs onto the dachshund&#39;s hat."></canvas>
  <div class="controls">
    <button id="replay" type="button" aria-label="Replay from the start">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
    <button id="playback" type="button" aria-label="Pause animation"><span aria-hidden="true" class="icon"></span></button>
  </div>
</main>
<script>
'use strict';
// The Fir & the Dachshund: a looping ASCII Christmas scene on one canvas. A strand spells out a
// carol as it winds up into a turning fir lettered with Christmas words; fairy lights, baubles
// and the star come on; presents drop in; a dachshund in a Santa hat trots up, a snowflake lands
// on its nose, and it sneezes, shaking snow off the tree onto its hat.
//
// Everything is laid out in an 800x640 scene space and scaled to fit the canvas. Shapes that never
// change (the dog's poses, the presents, the snowfield, the tree's glyphs) are painted once at the
// screen's pixel density and stamped every frame; see sharpen().

// ---------- Setup and helpers ----------
const view = document.querySelector('#scene');
const ctx = view.getContext('2d');
const button = document.querySelector('#playback');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const SIZE = 800, TAU = Math.PI * 2;
const mono = 'Menlo, Consolas, "Liberation Mono", monospace';
const clamp = n => Math.min(1, Math.max(0,n));
const smooth = n => { n=clamp(n); return n*n*(3-2*n) };
function hash(a,b) {
  const v=Math.sin(a*127.1+b*311.7)*43758.5453;
  return v-Math.floor(v);
}
// Shapes are painted in colour into this offscreen mask, then sampled into glyphs by etch().
const mask = document.createElement('canvas');
mask.width = mask.height = SIZE;
const ink = mask.getContext('2d',{willReadFrequently:true});
function shape(d,fill,edge,width=2) {
  const p=new Path2D(d);
  if(fill){ ink.fillStyle=fill; ink.fill(p) }
  if(edge){ ink.strokeStyle=edge; ink.lineWidth=width; ink.stroke(p) }
}
function oval(x,y,rx,ry,color) {
  ink.beginPath(); ink.ellipse(x,y,rx,ry,0,0,TAU); ink.fillStyle=color; ink.fill();
}
function rect(x,y,w,h,color) { ink.fillStyle=color; ink.fillRect(x,y,w,h) }
function glyph(c,ch,x,y,color,size=9) {
  c.fillStyle=color; c.font=size+'px '+mono; c.fillText(ch,x,y);
}
// The timeline, in milliseconds from the start of each loop.
const startRise=460, fullTree=startRise+6100;            // the strand winds up, the boughs open
const lightStart=fullTree+80, lightsReady=lightStart+780; // lights come on from the bottom up
const enter=lightsReady+1250, arrived=enter+1920;        // the dog trots in
const contact=arrived+1900, sneeze=contact+690;          // the flake lands on its nose; the sneeze
const fade=sneeze+3350, cycle=fade+1400;                 // a pause, then fade out and loop

// ---------- Painting shapes in type ----------
// Sample the painted mask into glyph records, painted later at the screen's real resolution so
// they stay crisp on high-density displays. Presents spell their `chars` along each row; the
// dog's fur scatters them. Below y=498 the legs swing: rear ones (left of x=420) one way,
// front ones the other. `flip` mirrors the shape about x=395 but keeps the glyphs upright,
// which is how the dog turns to face the tree.
function etch(chars,{stepX=4.4,stepY=5.4,size=7,stride=0,flip=false,spell=true}={}) {
  const data=ink.getImageData(0,0,SIZE,SIZE).data, marks=[];
  for(let y=2;y<SIZE;y+=stepY) for(let x=2;x<SIZE;x+=stepX) {
    const sx=Math.round(x), sy=Math.round(y), i=4*(sy*SIZE+sx);
    if(data[i+3]<100 || !(data[i]+data[i+1]+data[i+2])) continue;
    const leg=clamp((sy-498)/25), at=sx+(sx>420?1:-1)*leg*stride;
    const col=Math.round((flip?790-x:x)/stepX), line=Math.round(y/stepY);
    const ch=spell?chars[(col+line*7)%chars.length]:chars[Math.floor(hash(sx,sy)*chars.length)];
    marks.push({ch,x:flip?790-at:at,y:sy,size,color:'rgb('+data[i]+','+data[i+1]+','+data[i+2]+')'});
  }
  ink.clearRect(0,0,SIZE,SIZE);
  return marks;
}
// Paint glyph records into a canvas cropped to their extent, at `scale` pixels per unit.
function paintMarks(marks,scale,reach=[],solid=false) {
  let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
  for(const {x,y} of [...marks,...reach]) {
    left=Math.min(left,x); right=Math.max(right,x);
    top=Math.min(top,y); bottom=Math.max(bottom,y);
  }
  left-=10; top-=10; right+=10; bottom+=10;
  const el=document.createElement('canvas');
  el.width=Math.ceil((right-left)*scale); el.height=Math.ceil((bottom-top)*scale);
  const c=el.getContext('2d');
  c.setTransform(scale,0,0,scale,-left*scale,-top*scale);
  c.textAlign='center'; c.textBaseline='middle';
  // Solid shapes get a black cell behind each letter, so nothing behind shows through.
  if(solid) { c.fillStyle='#000'; for(const m of marks) c.fillRect(m.x-2.4,m.y-2.9,4.8,5.8); }
  let font='';
  for(const m of marks) {
    const f=m.size+'px '+mono;
    if(f!==font) c.font=font=f;
    c.fillStyle=m.color; c.fillText(m.ch,m.x,m.y);
  }
  return {canvas:el,pen:c,x:left,y:top,w:el.width/scale,h:el.height/scale};
}
// ---------- The dachshund ----------
// Puppy proportions: the head is drawn a little larger than the body calls for.
const HEAD=1.1;
// Head features turn (and grow) with the head around the neck.
function aboutNeck(x,y,a) {
  const dx=(x-461)*HEAD,dy=(y-453)*HEAD,c=Math.cos(a),s=Math.sin(a);
  return [461+dx*c-dy*s,453+dx*s+dy*c];
}
const mirror=x=>790-x;
// Where the nose sits on the head, before the head turns.
const NOSE=[535,439];
// The Santa hat sits on the crown, its tip flopped back. Points on it are in its own frame.
const hatX=482, hatY=412, hatTilt=-.08, hatSize=.95;
function onHat(x,y) {
  const c=Math.cos(hatTilt)*hatSize,s=Math.sin(hatTilt)*hatSize;
  return [hatX+x*c-y*s,hatY+x*s+y*c];
}
// The dachshund is drawn facing right in the mask, then mirrored to face the tree: a brown
// coat with a sheen along its back, a dark floppy ear and a little smile.
function dogFrame(pose,wag,earLift=0,stride=0) {
  const coat='#a2602f', rim='#c27c45', dark='#7d4626';
  shape('M362 494 L359 519 Q358 525 370 524 L374 522 L370 517 L379 497Z M450 496 L448 521 Q450 525 461 523 L462 520 L457 516 L465 496Z',dark);
  shape(`M357 474 Q341 ${465-3*wag} ${334-4*wag} ${444-7*wag} Q333 ${436-7*wag} ${340-4*wag} ${439-6*wag} Q346 458 364 466Z`,coat,rim,2);
  shape('M352 482 Q350 462 372 458 Q410 456 440 452 Q452 446 458 440 L478 442 Q488 470 476 488 Q468 498 462 500 L463 518 Q474 520 471 526 L454 526 L449 503 Q420 507 392 505 Q378 504 372 503 L368 519 Q379 521 375 526 L357 526 Q352 522 356 512 L357 500 Q348 494 352 482Z',coat,rim,3);
  shape('M372 466 Q410 462 444 456',null,'#d38f57',4);
  ink.save(); ink.translate(461,453); ink.rotate(pose); ink.scale(HEAD,HEAD); ink.translate(-461,-453);
  // A long, gently tapering snout.
  shape('M447 453 Q448 433 460 421 Q473 408 490 410 Q506 412 513 426 L533 434 Q543 437 538 445 Q531 452 512 450 Q495 456 482 468Z',coat,rim,3);
  // The felt cap's bent tip and pom flop backwards and swing on the sneeze.
  ink.save(); ink.translate(hatX,hatY); ink.rotate(hatTilt+earLift*.32); ink.scale(hatSize,hatSize);
  shape('M17 3 Q16 -11 8 -25 Q2 -37 -8 -32 Q-17 -26 -15 -13 Q-10 -22 -5 -21 Q-6 -10 -18 0Z',
    '#d64236','#fb7856',2.8);
  shape('M13 -2 Q9 -15 5 -22',null,'#ef6749',3);
  oval(-15,-12,5.8,6.2,'#fff0d7');
  shape('M20 -1 Q4 -9 -16 -3 L-19 6 Q2 1 19 8Z','#ffe8cd','#fff4e6',2.5);
  ink.restore();
  // The ear hangs from under the hat brim and flaps on the trot and the sneeze.
  ink.save(); ink.translate(474,418); ink.rotate(earLift); ink.translate(-474,-418);
  shape('M470 417 Q455 417 451 440 Q447 465 459 471 Q472 476 478 453 L483 425Z','#6a3a22','#8b5232',2.5);
  ink.restore();
  ink.restore();
  const marks=etch('o%x+#=:',{stride,flip:true,stepX:3.6,stepY:4.5,size:5.8,spell:false});
  const [eyeX,eyeY]=aboutNeck(500,425,pose), [noseX,noseY]=aboutNeck(...NOSE,pose);
  const [mouthX,mouthY]=aboutNeck(519,448,pose);
  return {marks,pose,eye:{x:mirror(eyeX),y:eyeY,shut:pose>.1},nose:{x:mirror(noseX),y:noseY},
    mouth:{x:mirror(mouthX),y:mouthY},art:null};
}
function paintDog(frame,scale) {
  const {eye,nose,mouth,pose}=frame;
  const art=paintMarks(frame.marks,scale,[nose]), c=art.pen;
  // Leave a gap in the fur so the eye reads, then set the eye itself in type:
  // open, or squeezed shut for the sneeze.
  c.save(); c.translate(eye.x,eye.y); c.scale(HEAD,HEAD);
  c.globalCompositeOperation='destination-out';
  c.beginPath(); c.ellipse(0,0,5,4.6,0,0,TAU); c.fill();
  c.globalCompositeOperation='source-over';
  if(eye.shut) glyph(c,'>',0,0,'#fff3df',9);
  else glyph(c,'o',0,-.8,'#fff3df',10);
  c.restore();
  // The smile is a ) turned on its side, cut into the fur under the snout.
  c.save(); c.translate(mouth.x,mouth.y); c.rotate(Math.PI/2-pose); c.scale(HEAD,HEAD);
  c.globalCompositeOperation='destination-out'; c.font='bold 10px '+mono; c.fillText(')',0,0);
  c.restore();
  c.save(); c.translate(nose.x,nose.y); c.rotate(-pose); c.scale(HEAD,HEAD);
  glyph(c,'@',0,0,'#f1d2bf',12); c.restore();
  return art;
}

const still=dogFrame(0,0), lean=dogFrame(-.04,.55);
const trot=Array.from({length:8},(_,i)=>{
  const swing=Math.sin(i*TAU/8);
  return dogFrame(-.035+.026*swing,swing,.08*swing,9*swing);
});
const wait=[still,lean,dogFrame(-.065,1),lean,still,dogFrame(0,-.45)];
const sniff=dogFrame(-.18,.45), recoil=dogFrame(.24,-.9,.43), recover=dogFrame(-.07,.8,-.13);
const dogFrames=[...new Set([...trot,...wait,sniff,recoil,recover])];

// ---------- Presents ----------
// Presents under the tree: real boxes seen from a little above, so the lid and the right side
// show, tied with a ribbon cross and a bow, and lettered with their own tags. Each is drawn in
// the mask GIFT times larger than it appears, the bottom of its front face centred on
// (400,400), in two pieces: the box, and the lid with its bow, which pops on landing.
const GIFT=1.6;
function face(points,color) {
  ink.beginPath(); points.forEach(([x,y],i)=>i?ink.lineTo(x,y):ink.moveTo(x,y));
  ink.closePath(); ink.fillStyle=color; ink.fill();
}
const gifts=[
  {x:183,y:507,w:38,h:31,d:26,words:'TO*YOU*',box:'#4c6aa3',side:'#33497a',top:'#7d9fd6',ribbon:'#e9eef2',snow:true},
  {x:236,y:522,w:50,h:41,d:32,words:'GIFT*FOR*YOU*',box:'#b3433a',side:'#7c2c26',top:'#de6a58',ribbon:'#ecc56c'},
  {x:343,y:526,w:38,h:47,d:28,words:'OPEN*ME*',box:'#d8d0c0',side:'#a29a8b',top:'#f6f1e6',ribbon:'#cc4a3f'},
  {x:290,y:537,w:36,h:29,d:24,words:'JOY*TO*ALL*',box:'#3e7d55',side:'#28543a',top:'#66ad7d',ribbon:'#e5675b',snow:true},
  {x:392,y:534,w:30,h:25,d:20,words:'XOXO*',box:'#c4943f',side:'#8c6828',top:'#e9c068',ribbon:'#4c9a68'},
].map(g=>{
  const w=g.w*GIFT, h=g.h*GIFT, d=g.d*GIFT, dx=d*.42, dy=d*.34;
  const lid=Math.max(7,h*.2), band=Math.max(6,w*.15), half=band/(2*d), o=2.5;
  const L=400-w/2, R=400+w/2, T=400-h, mid=(k,x,y)=>[x+dx*k,y-dy*k];
  // The box: front and right side below the lid, the ribbon running down both.
  face([[L,T+lid],[R,T+lid],[R,400],[L,400]],g.box);
  face([[R,T+lid],mid(1,R,T+lid),mid(1,R,400),[R,400]],g.side);
  rect(400-band/2,T+lid,band,h-lid,g.ribbon);
  face([mid(.5-half,R,T+lid),mid(.5+half,R,T+lid),mid(.5+half,R,400),mid(.5-half,R,400)],g.ribbon);
  rect(L,T+lid,w,2.2,g.side);
  const body=etch(g.words);
  // The lid: a lighter top, a slight overhang, the ribbon crossing over it, and the bow.
  face([[L-o,T],[R+o,T],mid(1,R+o,T),mid(1,L-o,T)],g.top);
  face([[L-o,T],[R+o,T],[R+o,T+lid],[L-o,T+lid]],g.box);
  face([[R+o,T],mid(1,R+o,T),mid(1,R+o,T+lid),[R+o,T+lid]],g.side);
  rect(400-band/2,T,band,lid,g.ribbon);
  face([[400-band/2,T],[400+band/2,T],mid(1,400+band/2,T),mid(1,400-band/2,T)],g.ribbon);
  face([mid(.5-half,L-o,T),mid(.5-half,R+o,T),mid(.5+half,R+o,T),mid(.5+half,L-o,T)],g.ribbon);
  face([mid(.5-half,R+o,T),mid(.5+half,R+o,T),mid(.5+half,R+o,T+lid),mid(.5-half,R+o,T+lid)],g.ribbon);
  if(g.snow) { ink.fillStyle='#eef3f5'; ink.beginPath(); ink.ellipse(L+w*.26+dx*.5,T-dy*.5,w*.15,dy*.32+1.5,0,0,TAU); ink.fill(); }
  const [bx,by]=mid(.5,400,T), bow=Math.max(1.3,w/52);
  ink.fillStyle=g.ribbon;
  for(const s of [-1,1]) {
    ink.beginPath(); ink.ellipse(bx+s*9*bow,by-5*bow,10*bow,6.5*bow,s*.45,0,TAU); ink.fill();
    face([[bx,by],[bx+s*7*bow,by+9*bow],[bx+s*11*bow,by+7*bow]],g.ribbon);
  }
  oval(bx,by-2.5*bow,4.8*bow,4.8*bow,g.ribbon);
  ink.globalAlpha=.4; oval(bx,by-2.5*bow,4.8*bow,4.8*bow,'#fff'); ink.globalAlpha=1;
  const cap=etch(g.words);
  return {...g,body,cap,hinge:[400,T+lid],art:null,lidArt:null};
}).sort((a,b)=>a.y-b.y);
// They arrive from left to right once the lights are on.
[...gifts].sort((a,b)=>a.x-b.x).forEach((g,rank)=>g.rank=rank);

// ---------- The tree ----------
// Project the turning boughs into a depth-tested character grid.
const width=800,height=640,cellX=3.7,cellY=5.5;
const cols=Math.ceil(width/cellX), rows=Math.ceil(height/cellY);
const depths=new Float32Array(cols*rows), tones=new Int8Array(cols*rows);
const treeX=343, foot=495, crown=82, treeHeight=foot-crown;
const levels=8, sectors=66, bands=8;
// How far each tier's boughs reach, from the bottom skirt (up=0) to the tip (up=1).
const tierSpread=up=>147-127*up;
const vertices=[],faces=[];
for(let level=0;level<levels;level++) {
  const base=vertices.length, up=level/(levels-1);
  const hem=foot-20-335*up;
  const tierHeight=123-64*up;
  const spread=tierSpread(up);
  for(let row=0;row<=bands;row++) {
    const r=.008+.992*row/bands;
    for(let col=0;col<sectors;col++) {
      const angle=col*TAU/sectors;
      const lobe=.5+.5*Math.cos(angle*(13-level)+level*1.9);
      const fringe=r*r*r;
      const radius=spread*r*(.94+fringe*(lobe*.11+.025*Math.sin(angle*5)));
      const y=hem-tierHeight+tierHeight*Math.pow(r,.83)+fringe*(lobe*10-4);
      vertices.push({x:radius*Math.sin(angle),z:radius*Math.cos(angle),y,azimuth:angle,
        nx:Math.sin(angle),nz:Math.cos(angle),edge:r,vein:lobe,ring:spread*r});
      if(row===bands) continue;
      // Each face carries its corners' azimuths, unwrapped so the seam face runs on to 2π.
      // The lettering is laid out along the boughs from them, so the words turn with the tree.
      const a=base+row*sectors+col,b=base+row*sectors+(col+1)%sectors;
      const from=col*TAU/sectors, to=(col+1)*TAU/sectors;
      faces.push([a,b,a+sectors,from,to,from],[b,b+sectors,a+sectors,to,to,from]);
    }
  }
}
const px=new Float32Array(vertices.length), py=new Float32Array(vertices.length);
const pz=new Float32Array(vertices.length), value=new Float32Array(vertices.length);
const ringR=Float32Array.from(vertices,v=>v.ring);
const texAngle=new Float32Array(cols*rows), texRing=new Float32Array(cols*rows);
const pine=['#11291f','#183b2d','#20503a','#276444','#327c54','#479561','#6dac7c','#9bc5a0'];
// The tree is lettered with carols and greetings: capitals where the light catches the
// boughs, lower case in the shade.
const treeWords='MERRY*CHRISTMAS*JOY*NOEL*PEACE*ON*EARTH*DECK*THE*HALLS*FA*LA*LA*SILENT*NIGHT*HOLLY*JINGLE*BELLS*EVERGREEN*GOOD*TIDINGS*';
const treeGlyphs=[...new Set(treeWords+treeWords.toLowerCase())];
const upperMark=[...treeWords].map(ch=>treeGlyphs.indexOf(ch));
const lowerMark=[...treeWords.toLowerCase()].map(ch=>treeGlyphs.indexOf(ch));
// Cache glyphs so a frame needs one image stamp per occupied cell.
// The atlas is redrawn at the canvas's pixel density whenever that changes.
const tile=16;
let atlas=null, atlasTile=tile;
function paintAtlas(scale) {
  atlasTile=Math.ceil(tile*scale);
  atlas=document.createElement('canvas');
  atlas.width=treeGlyphs.length*atlasTile; atlas.height=pine.length*atlasTile;
  const pen=atlas.getContext('2d');
  pen.setTransform(atlasTile/tile,0,0,atlasTile/tile,0,0);
  pen.textAlign='center'; pen.textBaseline='middle';
  for(let shade=0;shade<pine.length;shade++) treeGlyphs.forEach((mark,k)=>
    glyph(pen,mark,k*tile+8,shade*tile+8,pine[shade],6.4));
}
function leafTriangle(a,b,c,ta,tb,tc) {
  const x=px[a],y=py[a], bx=px[b]-x,by=py[b]-y,cx=px[c]-x,cy=py[c]-y;
  const det=bx*cy-by*cx;
  if(Math.abs(det)<.001) return;
  const left=Math.max(0,Math.ceil(Math.min(x,px[b],px[c]))),right=Math.min(cols-1,Math.floor(Math.max(x,px[b],px[c])));
  const top=Math.max(0,Math.ceil(Math.min(y,py[b],py[c]))),bottom=Math.min(rows-1,Math.floor(Math.max(y,py[b],py[c])));
  for(let row=top;row<=bottom;row++) for(let col=left;col<=right;col++) {
    const u=((col-x)*cy-(row-y)*cx)/det, v=(bx*(row-y)-by*(col-x))/det;
    if(u<0||v<0||u+v>1) continue;
    const i=row*cols+col, z=pz[a]+u*(pz[b]-pz[a])+v*(pz[c]-pz[a]);
    if(z<=depths[i]) continue;
    depths[i]=z;
    tones[i]=Math.min(7,Math.max(0,Math.floor(value[a]+u*(value[b]-value[a])+v*(value[c]-value[a]))));
    texAngle[i]=ta+u*(tb-ta)+v*(tc-ta);
    texRing[i]=ringR[a]+u*(ringR[b]-ringR[a])+v*(ringR[c]-ringR[a]);
  }
}
// A continuous strand leads the reveal. Branches open around it in the same winding order.
const turns=3.4;
const emerging=new Uint8Array(vertices.length);
function coilRadius(u) { return 145*Math.pow(1-u,.83)+2; }
// The strand spells out the old carol as it winds up, one letter every third point.
const strandWords='O*CHRISTMAS*TREE*HOW*LOVELY*ARE*THY*BRANCHES*';
const strand=Array.from({length:940},(_,i)=>{
  const u=i/939, a=TAU*turns*u;
  return {u,a,r:coilRadius(u),offset:hash(i,91),letter:i%3?null:strandWords[(i/3)%strandWords.length]};
}).filter(p=>p.letter);
function drawStrand(growth,angle,front) {
  if(growth<=0||growth>=1) return;
  const tip=clamp(growth/.75);
  for(const p of strand) {

    for(let x=groundLeft+(row*1.7)%stepX,k=0;x<groundLeft+groundWidth;x+=stepX,k++) {
      const jx=x+(hash(k,row+740)-.5)*stepX*.5, h=driftHeight(jx,d);
      const slope=(driftHeight(jx+2,d)-driftHeight(jx-2,d))/4;
      let light=.5+.55*slope+.04*h+.1*Math.sin(jx/140+d*3)+.14*(hash(k,row+700)-.5);
      light*=(.62+.38*d)*(1-.5*Math.exp(-Math.pow((jx-treeX)/150,2)-Math.pow((y-505)/13,2)));
      const level=Math.max(0,Math.min(7,Math.floor(light*8)));
      if(!level) continue;
      const warm=.24*Math.exp(-Math.pow((jx-treeX)/170,2)-Math.pow((y-506)/28,2));
      const [r,g,b]=snowShade[level].map((v,i)=>Math.round(v+(warmLight[i]-v)*warm));
      const edge=clamp((jx-groundLeft)/140)*clamp((groundLeft+groundWidth-jx)/140);
      pen.globalAlpha=edge*smooth(d/.12)*(1-smooth((y-570)/14))*(.5+.5*d);
      const gy=y-h*.4*(1-.3*d)+(hash(k,row+750)-.5)*1.2;
      glyph(pen,snowRamp[level],jx,gy-(level<3?size*.25:0),'rgb('+r+','+g+','+b+')',size);
      if(level>=4&&hash(k,row+710)<.05) glintSpots.push({x:jx,y:gy,size,phase:hash(k,row+720)*TAU,speed:.6+.9*hash(k,row+730)});
    }
    y+=(4.2+4.3*d)*.74;
  }
}
// Sunlit crystals in the snowfield wink on and off.
function snowGlints(t) {
  const shown=smooth(t/900);
  for(const g of glintSpots) {
    const shine=Math.pow(Math.max(0,Math.cos(t*.0019*g.speed+g.phase)),26);
    if(shine<.06) continue;
    ctx.globalAlpha=shine*.9*shown;
    glyph(ctx,shine>.55?'+':'*',g.x,g.y+(shine>.55?0:g.size*.12),'#f2fbff',g.size*(.75+.6*shine));
  }
  ctx.globalAlpha=1;
}
// Falling snow in depth: a far haze of tiny flakes, a middle layer, near flakes that tumble as
// they fall, and a few big soft ones drifting right past the lens. A slow wind sways them all,
// the nearer ones more. Flakes span past the scene's edges so wide screens snow to the borders.
function snowLayer(count,seed,{size,speed,alpha,chars,color,bottom,sway,spin=false,blur=0}) {
  return Array.from({length:count},(_,i)=>({
    x:-120+hash(i,seed)*1040, start:hash(i,seed+1), drift:hash(i,seed+2)*TAU,
    speed:speed[0]+(speed[1]-speed[0])*hash(i,seed+3), size:Math.round((size[0]+(size[1]-size[0])*hash(i,seed+4))*2)/2,
    ch:chars[Math.floor(hash(i,seed+5)*chars.length)], spin:spin?(hash(i,seed+6)-.5)*3:0,
    alpha:alpha*(.7+.3*hash(i,seed+7)), color, bottom, sway, blur})).sort((a,b)=>a.size-b.size);
}
const farSnow=snowLayer(300,32,{size:[4.5,6.5],speed:[.22,.38],alpha:.42,chars:'..:',color:'#7f99a6',bottom:505,sway:5});
const midSnow=snowLayer(150,110,{size:[7.5,11],speed:[.42,.62],alpha:.62,chars:'..*+',color:'#b3cad3',bottom:548,sway:10});
const nearSnow=snowLayer(48,140,{size:[13,19],speed:[.7,1],alpha:.85,chars:'**+',color:'#e2eef2',bottom:600,sway:18,spin:true});
const lensSnow=snowLayer(5,170,{size:[32,46],speed:[1.1,1.4],alpha:.13,chars:'*',color:'#dbe9ee',bottom:640,sway:26,spin:true,blur:6});
// Flakes keep their pace however long the loop runs.
const snowPeriod=19270;
const wind=t=>.6*Math.sin(t*.00031)+.4*Math.sin(t*.00077+1.3);
function snowfall(flakes,t) {
  const shown=smooth(t/620), gust=wind(t);
  let font='';
  ctx.fillStyle=flakes[0].color;
  for(const p of flakes) {
    const f0=p.size+'px '+mono;
    if(f0!==font) ctx.font=font=f0;
    const f=(p.start+t/snowPeriod*p.speed)%1, y=-10+f*(p.bottom+10);
    const x=p.x+Math.sin(f*TAU*1.25+p.drift)*p.sway+f*p.sway+gust*p.sway*1.4;
    ctx.globalAlpha=shown*smooth(f/.08)*smooth((1-f)/.1)*p.alpha;
    if(p.blur) { ctx.shadowColor=p.color; ctx.shadowBlur=p.blur; }
    if(p.spin) {
      ctx.save(); ctx.translate(x,y); ctx.rotate(t*.001*p.spin+p.drift);
      ctx.fillText(p.ch,0,p.ch==='*'?p.size*.14:0); ctx.restore();
    } else ctx.fillText(p.ch,x,y-(p.ch==='.'?p.size*.3:0));
    if(p.blur) ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
// ---------- Drawing a frame ----------
// Redraw every cached layer whenever the canvas's pixels-per-scene-unit changes.
let detail=0;
function sharpen(zoom) {
  const next=Math.min(4,Math.max(1,Math.ceil(zoom*2)/2));
  if(next===detail) return;
  detail=next;
  paintAtlas(next); paintGround(next);
  for(const frame of dogFrames) frame.art=paintDog(frame,next*dogScale);
  for(const g of gifts) { g.art=paintMarks(g.body,next/GIFT,[],true); g.lidArt=paintMarks(g.cap,next/GIFT,[],true); }
}
function draw(time) {
  const t=time%cycle;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,view.width,view.height);
  const zoom=Math.min(view.width/540,view.height/553);
  ctx.setTransform(zoom,0,0,zoom,view.width/2-407*zoom,view.height/2-305*zoom);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const growth=clamp((t-startRise)/(fullTree-startRise)),angle=.46+t*.00022;
  const lit=smooth((t-lightStart)/(lightsReady-lightStart));
  snowfall(farSnow,t);
  ctx.globalAlpha=smooth(t/800);
  ctx.drawImage(ground,groundLeft,groundTop,groundWidth,groundSpan);
  snowGlints(t);
  // A dusting of snow under the tree that spreads as it grows, and the ring the strand starts from.
  const snow=smooth(t/850);
  for(let i=0;i<155;i++) {
    const a=hash(i,11)*TAU, r=Math.sqrt(hash(i,13));
    const x=treeX+Math.cos(a)*r*(60+131*growth),y=foot+8+Math.sin(a)*r*(4+15*growth);
    ctx.globalAlpha=snow*(.20+.47*(1-r));
    glyph(ctx,i%7===0?'-':'.',x,y,'#799187',8);
  }
  const ringIn=smooth(t/510)*(1-smooth((t-startRise)/950));
  for(let i=0;i<58;i++) {
    const a=i/58*TAU;
    ctx.globalAlpha=ringIn*(.38+.38*Math.cos(a-.55));
    glyph(ctx,'-',treeX+Math.cos(a)*53,foot+Math.sin(a)*6,'#b6c6a9',8);
  }
  ctx.globalAlpha=1;
  drawStrand(growth,angle,false);
  drawPine(growth,angle,t,lit);
  drawStrand(growth,angle,true);
  lightTree(t,angle,lit);
  snowfall(midSnow,t);
  drawGifts(t);
  drawDog(t);
  snowfall(nearSnow,t);
  snowfall(lensSnow,t);
  if(t>fade) {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='rgba(0,0,0,'+smooth((t-fade)/(cycle-fade))+')';
    ctx.fillRect(0,0,view.width,view.height);
  }
}
// ---------- Playback ----------
// With reduced motion the scene holds still on the moment the flake lands on the dog's nose.
let elapsed=motion.matches?contact:0, origin=0, frame=0, running=false, playing=!motion.matches;
function tick(now) {
  // A frame's timestamp can predate the moment playback (re)started; never run time backwards.
  const next=Math.max(0,now-origin);
  if(Math.floor(next/33)!==Math.floor(elapsed/33)) draw(next);
  elapsed=next;
  frame=requestAnimationFrame(tick);
}
function stopPlayback() {
  if(running) elapsed=Math.max(0,performance.now()-origin);
  running=false; cancelAnimationFrame(frame);
}
function syncPlayback() {
  button.dataset.playing=String(playing);
  button.setAttribute('aria-label',playing?'Pause animation':'Play animation');
  draw(elapsed);
  if(!playing||document.hidden) return;
  origin=performance.now()-elapsed; running=true;
  frame=requestAnimationFrame(tick);
}
function resize() {
  const density=Math.min(3,devicePixelRatio||1);
  view.width=Math.max(1,Math.round(view.clientWidth*density));
  view.height=Math.max(1,Math.round(view.clientHeight*density));
  sharpen(Math.min(view.width/540,view.height/553));
  draw(elapsed);
}
function togglePlayback() { stopPlayback(); playing=!playing; syncPlayback(); }
function replay() { stopPlayback(); elapsed=0; playing=true; syncPlayback(); }
button.addEventListener('click',togglePlayback);
document.querySelector('#replay').addEventListener('click',replay);
view.addEventListener('click',togglePlayback);
// Space or K toggles playback and R replays, from anywhere. A focused button already
// answers Space itself, so leave that one alone there.
addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  const onButton=e.target instanceof HTMLButtonElement;
  if((e.code==='Space'&&!onButton)||e.key==='k'||e.key==='K') { e.preventDefault(); togglePlayback(); }
  else if(e.key==='r'||e.key==='R') { e.preventDefault(); replay(); }
});
motion.addEventListener('change',()=>{stopPlayback(); playing=!motion.matches; if(!playing) elapsed=contact; syncPlayback()});
document.addEventListener('visibilitychange',()=>{stopPlayback(); syncPlayback()});
new ResizeObserver(resize).observe(view);
resize(); syncPlayback();
</script>
</body>
